# Builds the signed Android app for a version tag (v1.2.3) and publishes it as a GitHub Release.
# Installed apps find it there and update themselves (android/.../Updater.kt).
#
# Secrets (Settings → Secrets and variables → Actions):
#   NOTIFIER_KEYSTORE_BASE64    base64 of the .jks keystore
#   NOTIFIER_KEYSTORE_PASSWORD, NOTIFIER_KEY_ALIAS, NOTIFIER_KEY_PASSWORD
# Every release must be signed with the same key, or phones refuse the update.
name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTIFIER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::NOTIFIER_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          NOTIFIER_KEYSTORE: ${{ runner.temp }}/release.jks
          NOTIFIER_KEYSTORE_PASSWORD: ${{ secrets.NOTIFIER_KEYSTORE_PASSWORD }}
          NOTIFIER_KEY_ALIAS: ${{ secrets.NOTIFIER_KEY_ALIAS }}
          NOTIFIER_KEY_PASSWORD: ${{ secrets.NOTIFIER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="notifier-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Notifier ${GITHUB_REF_NAME#v}" --generate-notes
