<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Notifier settings - a Telegram Mini App.">
  <title>Notifier</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Must load before Flutter: it reads Telegram's launch data from the URL hash at startup
       and sets the --tg-theme-* CSS variables used by the loader below. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: var(--tg-theme-bg-color, #ffffff); }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px -apple-system, system-ui, sans-serif; color: var(--tg-theme-hint-color, #999999);
    }
  </style>
  <script>
    // Called from Dart once the first frame is up.
    function removeLoader() { var el = document.getElementById('loading'); if (el) el.remove(); }
  </script>
</head>
<body>
  <div id="loading">Loading settings…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
